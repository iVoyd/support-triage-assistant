# Configuration for the triage assistant. Change [project] and [docs] to target another repo.

[project]
repo = "supabase/supabase"

[docs]
# A git URL (cloned shallow + sparse) or a local path.
source = "https://github.com/supabase/supabase.git"
# Folder inside the source that holds the Markdown/MDX docs.
subdir = "apps/docs/content/guides"
# Public URL for that folder. A file "auth/passwords.mdx" becomes {url_base}/auth/passwords.
url_base = "https://supabase.com/docs/guides"

[triage]
model = "claude-haiku-5-5"
effort = "low"
top_k = 5
max_tokens = 4000
# Prompt templates live in triage/prompt.py; see eval/CHANGELOG.md for what changed.
prompt_version = "v2"
# Drop retrieved doc chunks scoring below this BM25 score. A first guess: tune it with the
# threshold table in eval/SCORECARD.md.
min_score = 20.0

# Area name = short description shown to the model. Order is kept.
[triage.areas]
auth = "Supabase Auth: sign-up, login, OAuth/SSO providers, sessions, JWTs, MFA"
database = "Postgres, SQL, migrations, extensions, RLS policies, pgvector, connection pooling"
storage = "Supabase Storage: buckets, uploads, image transformations, S3 compatibility"
realtime = "Realtime: broadcast, presence, Postgres changes subscriptions"
edge-functions = "Edge Functions: Deno runtime, deploy, invoke, secrets"
cli = "Supabase CLI and local development (supabase start, db diff, link, migrations tooling)"
studio = "Supabase Studio / dashboard UI, table editor, SQL editor"
client-libraries = "supabase-js, supabase-py, supabase-dart, supabase-swift and other SDKs"
self-hosting = "Self-hosted Supabase, Docker setup, configuration"
platform = "Hosted platform: billing, projects, branching, backups, regions, limits"
docs = "Documentation content or docs website problems"
other = "Anything that fits none of the above"

[duplicates]
candidates = 5          # TF-IDF candidates per issue
min_similarity = 0.2    # cosine below this: no model call, "no duplicate"

# Seeding eval/labels.csv: GitHub label -> our value. Unmapped labels are ignored.
[labels.types]
bug = "bug"
enhancement = "feature"
feature-request = "feature"
documentation = "docs"
question = "question"

[labels.areas]
auth = "auth"
storage = "storage"
studio = "studio"
realtime = "realtime"
"edge functions" = "edge-functions"
self-hosted = "self-hosting"
postgres = "database"
postgREST = "database"
branching = "platform"
cli = "cli"
documentation = "docs"

# USD per million tokens. Check https://www.anthropic.com/pricing before trusting cost numbers.
[prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01
